plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    id 'maven-publish'
}

group = "com.github.therekrab"
version = "1.7.0-alpha-6"

tasks.withType(Javadoc) {
    options {
        title = "Autopilot API"
        links "https://docs.oracle.com/en/java/javase/25/docs/api/", 'https://github.wpilib.org/allwpilib/docs/release/java/'
    }
}

ext.wpilibVersion = "2027.0.0-alpha-6"
ext.wpilibYear = "2027_alpha5"

def wpilibHome = {
    if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
        def publicFolder = System.getenv('PUBLIC') ?: 'C:\\Users\\Public'
        return new File(new File(publicFolder, 'wpilib'), wpilibYear)
    }
    return new File(new File(System.getProperty('user.home'), 'wpilib'), wpilibYear)
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
    maven {
        name = "wpilibHome"
        url = new File(wpilibHome(), "maven")
    }
}

dependencies {
    implementation "org.wpilib.cscore:cscore-java:$wpilibVersion"
    implementation "org.wpilib.cameraserver:cameraserver-java:$wpilibVersion"
    implementation "org.wpilib.ntcore:ntcore-java:$wpilibVersion"
    implementation "org.wpilib.wpilibj:wpilibj-java:$wpilibVersion"
    implementation "org.wpilib.wpiutil:wpiutil-java:$wpilibVersion"
    api "org.wpilib.wpimath:wpimath-java:$wpilibVersion"
    api "org.wpilib.wpiunits:wpiunits-java:$wpilibVersion"
    implementation "org.wpilib.hal:hal-java:$wpilibVersion"
    implementation "org.ejml:ejml-simple:0.44.0"
    implementation "com.fasterxml.jackson.core:jackson-annotations:2.15.2"
    implementation "com.fasterxml.jackson.core:jackson-core:2.15.2"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.15.2"

    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'us.hebi.quickbuf:quickbuf-runtime:1.4'
}

publishing {
	repositories {
		maven {
			name = "vendordep"
			url = layout.buildDirectory.dir("vendordep/maven")
		}
	}

	publications {
		maven(MavenPublication) {
			from components.java
			groupId = project.group
			artifactId = "autopilot"
			version = project.version
		}
	}
}

java {
    withSourcesJar()
    withJavadocJar()

    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
    failOnNoDiscoveredTests = false
}

tasks.register('generateVendordep', Copy) {
    from(rootProject.file("vendordep.json"))
    into(layout.buildDirectory.dir("vendordep"))
    rename { "Autopilot.json" }
}

tasks.register('vendordepPackage') {
    dependsOn tasks.named('publishMavenPublicationToVendordepRepository')
    dependsOn tasks.named('generateVendordep')
}
